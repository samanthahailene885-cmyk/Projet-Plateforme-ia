{% extends 'base.html' %}

{% block title %}{{ title }} - Plateforme de Gestion{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">{{ title }}</h2>
    <a href="{% url 'permissions:list' %}" class="btn btn-secondary">
        <i class="fas fa-arrow-left me-2"></i>Retour
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <div class="alert alert-info">
                    <i class="fas fa-info-circle me-2"></i>
                    Les demandes de permission doivent être faites au moins 3 jours avant la date de début.
                </div>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
