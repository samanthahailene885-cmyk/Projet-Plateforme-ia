{% if delta is not None %}
<p class="sup-trend {% if delta > 0 %}trend-up{% elif delta < 0 %}trend-down{% else %}trend-flat{% endif %}">
    {% if delta > 0 %}<i class="fas fa-arrow-up"></i> +{{ delta }} %{% elif delta < 0 %}<i class="fas fa-arrow-down"></i> {{ delta }} %{% else %}<i class="fas fa-minus"></i> 0 %{% endif %}
</p>
{% endif %}
