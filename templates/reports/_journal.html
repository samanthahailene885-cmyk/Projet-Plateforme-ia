{% load static %}
<div class="journal">
    <img class="journal-bg" src="{% static 'reports/rapport-fond.png' %}" alt="Rapport journalier RAC'IN">
    <div class="journal-pill"><span>DATE DU JOUR :</span> {{ journal_date }}</div>
    <div class="journal-name">{{ journal_name }}</div>
    {% if editable %}
    <textarea class="journal-body" id="aiSummary" name="content" form="save-report-form" {% if read_only %}readonly{% endif %} placeholder="Le texte du rapport apparaîtra ici. Une activité par paragraphe.">{{ body }}</textarea>
    {% else %}
    <div class="journal-body journal-read">
        {% for bullet in bullets %}
        <p>{{ bullet }}</p>
        {% empty %}
        <p>Aucune activité rédigée pour cette date.</p>
        {% endfor %}
    </div>
    {% endif %}
</div>
