{% extends 'base.html' %}

{% block title %}Supprimer la tâche - Plateforme de Gestion{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0"><i class="fas fa-exclamation-triangle me-2"></i>Confirmation de suppression</h5>
            </div>
            <div class="card-body">
                <p class="mb-4">Êtes-vous sûr de vouloir supprimer la tâche <strong>{{ task.title }}</strong> ?</p>
                <p class="text-muted mb-4">Cette action est irréversible.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'tasks:detail' task.pk %}" class="btn btn-secondary">
                            <i class="fas fa-times me-2"></i>Annuler
                        </a>
                        <button type="submit" class="btn btn-danger">
                            <i class="fas fa-trash me-2"></i>Confirmer la suppression
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
