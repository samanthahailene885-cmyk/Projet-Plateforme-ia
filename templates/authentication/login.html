{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Connexion - Plateforme de Gestion{% endblock %}

{% block content %}
<div class="login-card">
    <div class="text-center mb-4">
        <h2 class="fw-bold mb-2">Bienvenue</h2>
        <p class="text-muted mb-0">Connectez-vous à votre espace professionnel.</p>
    </div>

    <form method="post" novalidate>
        {% csrf_token %}
        {% crispy form %}
    </form>

    <div class="text-center mt-4">
        <p class="mb-0">Pas encore de compte ? <a href="{% url 'authentication:register' %}" class="text-decoration-none fw-semibold">S'inscrire</a></p>
    </div>
</div>
{% endblock %}
